<style>
:root{--fg:#000;--mut:#3a3a3a;--hit:#0a6b2a;--onb:#0b4ea2;--out:#222;--misc:#6b2fa0;--y:#ffd400;--red:#c40000;--line:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--fg);font:17px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}
h2{font-size:19px;margin:18px 0 8px}
.pad{padding:12px}
.mut{color:var(--mut);font-size:14px}
.red{color:var(--red);font-weight:700}
.w{color:var(--hit);font-weight:800}.l{color:var(--red);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.grow{flex:1}
.top{padding:16px 12px 6px}
.tb{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;padding:8px 12px}
.tb h1{font-size:19px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border:2px solid #000;border-radius:10px;background:#fff;font-weight:700;text-align:center}
.btn.sm{min-height:38px;padding:0 10px;font-size:15px}
.btn.big{min-height:58px;font-size:18px}
.btn.pri{background:#000;color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.on{background:#000;color:#fff}
.btn:disabled{opacity:.35}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.menu-grid .pri{grid-column:1/-1}
.card{display:block;width:calc(100% - 24px);margin:10px 12px;padding:12px 14px;border:3px solid #000;border-radius:12px;background:#fff;text-align:left}
.card.go{background:var(--y)}
.card .k{font-size:14px;font-weight:700}
.card .big{font-size:22px;font-weight:800}
.list{display:flex;flex-direction:column;border-top:1px solid #000}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 12px;border:0;border-bottom:1px solid #000;background:#fff;text-align:left}
.li.off{color:#777}
.li .r{text-align:right;flex-shrink:0}
.banner{margin:8px 12px;padding:10px 12px;border:2px solid #000;border-radius:10px;background:#fff7c2;font-weight:600}
.banner.red{background:#ffe1e1;border-color:var(--red)}
.banner.blk{background:#000;color:#fff}
.banner .row{margin-top:8px}
.lbl{font-weight:800;margin:14px 0 6px}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:48px;border:2px solid #000;border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 12px;border:2px solid #000;border-radius:22px;background:#fff;font-weight:700}
.chip.on{background:#000;color:#fff}
.err{color:var(--red);font-weight:700;margin:8px 0}
/* 狀態列 */
.sb{position:sticky;top:0;z-index:6;background:#000;color:#fff;padding:6px 10px 8px}
.sb1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inn{font-size:24px;font-weight:900;line-height:1.1}
.inn small{display:block;font-size:13px;font-weight:700;color:var(--y)}
.outs{display:flex;gap:4px;align-items:center;font-size:13px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.dot.on{background:var(--red);border-color:var(--red)}
.cnt{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cnt small{font-size:12px;font-weight:700}
.dia{border:0;background:none;padding:0;color:#fff}
.sb2{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.score{font-size:21px;font-weight:900}
.clock{font-size:16px;font-weight:800;padding:2px 8px;border-radius:6px;border:0;background:#333;color:#fff;font-variant-numeric:tabular-nums}
.clock.warn{background:var(--y);color:#000}
.clock.over{background:var(--red);color:#fff}
/* 投手列 */
.pbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:2px solid #000}
.pname{flex:1;text-align:left;border:0;background:none;font-weight:700;padding:6px 0;min-height:40px}
.pc{font-size:20px;font-weight:900;padding:4px 10px;border-radius:8px;background:var(--hit);color:#fff;font-variant-numeric:tabular-nums}
.pc.y{background:var(--y);color:#000}
.pc.r{background:var(--red);color:#fff}
.tochip{min-height:40px;border:2px solid #000;border-radius:8px;background:#fff;font-weight:700;padding:0 8px;font-size:14px}
.tochip.y{background:var(--y)}.tochip.r{background:var(--red);color:#fff;border-color:var(--red)}
.batter{display:flex;justify-content:space-between;align-items:baseline;width:100%;border:0;background:#fff;padding:8px 10px;text-align:left}
.batter b{font-size:20px}
/* 投球 */
.pp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 10px 8px}
.pp.one{grid-template-columns:3fr 1fr}
.pb{min-height:54px;border:3px solid #000;border-radius:10px;background:#fff;font-weight:900;font-size:18px}
.pb.b{border-color:var(--hit);color:var(--hit)}
.pb.s{border-color:var(--red);color:var(--red)}
.pb.plus{background:var(--y)}
.ppinfo .btn{white-space:nowrap;flex-shrink:0}
.ppinfo{display:flex;align-items:center;gap:6px;padding:0 10px 8px;font-size:14px;font-weight:700}
/* 結果 */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px 10px}
.rb{min-height:58px;border:0;border-radius:10px;color:#fff;font-weight:800;font-size:17px;padding:2px}
.rb.hit{background:var(--hit)}.rb.onb{background:var(--onb)}.rb.out{background:var(--out)}.rb.misc{background:var(--misc)}
.rb.unk{background:#fff;color:#000;border:3px dashed #000}
.rb.dim{opacity:.3}
.rb.sm{min-height:44px;font-size:14px}
.rb.sel{outline:4px solid var(--y);outline-offset:-4px}
.recent{margin:0 10px;border:2px solid #000;border-radius:10px;overflow:hidden}
.recent .li{min-height:42px;font-size:15px}
.recent .li:last-child{border-bottom:0}
.half-h{background:#000;color:#fff;padding:6px 12px;font-weight:800;display:flex;justify-content:space-between}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--y);color:#000;margin-left:4px}
.badge.r{background:var(--red);color:#fff}
/* 底部列 */
#bbar:empty{display:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:3px solid #000;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bbar>div{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:640px}
.bbar button{min-height:52px;border:2px solid #000;border-radius:10px;background:#fff;font-weight:800;font-size:15px}
.bbar button.undo{background:#000;color:#fff}
/* 面板 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));border-top:4px solid #000}
.sh-h{display:flex;align-items:center;gap:8px;font-size:19px}
.sh-h b{font-size:20px}
.sh-h .x{margin-left:auto;min-width:44px;min-height:44px;border:2px solid #000;border-radius:10px;background:#fff;font-weight:900}
.rr{margin:8px 0}
.rl{font-weight:700;margin-bottom:4px}
.seg{display:grid;gap:4px}
.seg button{min-height:46px;border:2px solid #000;border-radius:8px;background:#fff;font-weight:800;font-size:15px;padding:0 2px}
.seg button.on{background:#000;color:#fff}
.seg button.x.on{background:var(--red);border-color:var(--red)}
.seg button.h.on{background:var(--hit);border-color:var(--hit)}
.sum{margin:10px 0;padding:8px 10px;background:#f0f0f0;border-radius:8px;font-weight:600}
.stp{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:800}
.stp span{flex:1}
.stp button{width:52px;height:46px;border:2px solid #000;border-radius:10px;background:#fff;font-size:22px;font-weight:900}
.stp b{min-width:28px;text-align:center;font-size:22px}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.field button{min-height:46px;border:2px solid var(--hit);background:#eaf6ee;font-weight:800;border-radius:8px}
.field button.of{border-radius:22px 22px 8px 8px}
.field button.on{background:var(--hit);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid button{min-height:50px;border:2px solid #000;border-radius:10px;background:#fff;font-weight:700;text-align:left;padding:4px 10px}
.pgrid button.on{background:#000;color:#fff}
.seq{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;padding:6px;border:2px dashed #000;border-radius:8px;margin-bottom:6px;font-weight:800}
.seq span{padding:2px 6px;border-radius:6px;background:#eee}
/* 提示 */
#toast{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;max-width:620px;width:100%;background:#000;color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#toast .t span{flex:1}
#toast .t button{min-height:40px;border:2px solid var(--y);border-radius:8px;background:#000;color:var(--y);font-weight:800;padding:0 10px}
/* 表格 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 6px}
.tbl{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{border:1px solid #000;padding:5px 6px;text-align:center;white-space:nowrap}
.tbl th{background:#000;color:#fff;font-weight:700}
.tbl td.l{text-align:left;color:inherit;font-weight:600}
.tbl tr.tot td{font-weight:800;background:#f0f0f0}
.tbl td.big{font-size:18px;font-weight:900}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{border:2px solid #000;border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:13px;font-weight:700}
.lead{border:2px solid #000;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.lead h3{margin:0 0 4px;font-size:16px}
.lead ol{margin:0;padding-left:22px}
.lead li{margin:2px 0}
.big-score{font-size:34px;font-weight:900;text-align:center;margin:6px 0}
pre.sumtxt{white-space:pre-wrap;background:#f4f4f4;border:2px solid #000;border-radius:10px;padding:10px;font:15px/1.5 inherit;max-height:50vh;overflow:auto}
/* 紙本 */
.paper{width:194mm;margin:0 auto;font-size:9pt;color:#000;background:#fff}
.paper h1{font-size:15pt;text-align:center;margin:0 0 2mm}
.paper h2{font-size:10.5pt;margin:2.5mm 0 1mm}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:0.3mm solid #000;padding:0 1mm;font-size:8.5pt;text-align:center}
.paper th{background:#e6e6e6;font-weight:700}
.paper .meta td{text-align:left;height:7mm}
.paper .g td{height:7.4mm}
.paper .o td{height:5.8mm}
.paper .pt td{height:7mm}
.paper .legend{font-size:7.5pt;line-height:1.35;margin-top:1.5mm}
.paper .two{display:grid;grid-template-columns:1.1fr 1fr;gap:3mm}
.paper td.nm{text-align:left;width:26mm}
.paper .cell{width:13mm}
.pwrap{overflow-x:auto;padding:10px 0}
@media (min-width:760px){#app{max-width:760px}.bbar>div{max-width:760px}.rb{min-height:68px;font-size:19px}.pb{min-height:62px}}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0}
  .pwrap{overflow:visible;padding:0}
  @page{size:A4 portrait;margin:7mm}
}

<body>
<div id="app"></div>
<div id="bbar" class="bbar"></div>
<div id="toast"></div>
<div id="sheet"></div>
<noscript>這個工具需要開啟 JavaScript。</noscript>
<script>
/* 工科系棒 比賽紀錄 — 記錄引擎（純函式，不碰畫面）
 * 所有資料都是事件；比分、壘包、出局、數據都由 compute() 從頭重算。
 */
(function (root) {
  'use strict';

  // ---------- 常數 ----------
  // ab: 算打數；hit: 壘打數；bat: 打進場內（可記方向、逐球自動補「打進場」）
  const RES = {
    '1B': { label: '一壘安打', short: '一安', hit: 1, ab: true, bat: true, cls: 'hit' },
    '2B': { label: '二壘安打', short: '二安', hit: 2, ab: true, bat: true, cls: 'hit' },
    '3B': { label: '三壘安打', short: '三安', hit: 3, ab: true, bat: true, cls: 'hit' },
    'HR': { label: '全壘打', short: '全壘打', hit: 4, ab: true, bat: true, cls: 'hit' },
    'BB': { label: '四壞球', short: '四壞', ab: false, cls: 'onb' },
    'HBP': { label: '觸身球', short: '觸身', ab: false, cls: 'onb' },
    'K': { label: '三振', short: '三振', ab: true, cls: 'out' },
    'UNK': { label: '沒看到（待補）', short: '沒看到', ab: false, cls: 'unk' },
    'GO': { label: '滾地球出局', short: '滾地出局', ab: true, bat: true, cls: 'out' },
    'FO': { label: '飛球出局', short: '飛球出局', ab: true, bat: true, cls: 'out' },
    'DP': { label: '雙殺打', short: '雙殺', ab: true, bat: true, cls: 'out' },
    'ROE': { label: '失誤上壘', short: '失誤上壘', ab: true, bat: true, cls: 'misc' },
    'FC': { label: '野手選擇', short: '野選', ab: true, bat: true, cls: 'misc' },
    'SH': { label: '犧牲觸擊', short: '犧觸', ab: false, bat: true, cls: 'misc' },
    'SF': { label: '高飛犧牲打', short: '犧飛', ab: false, bat: true, cls: 'misc' },
  };
  const RES_ORDER = ['1B', '2B', '3B', 'HR', 'BB', 'HBP', 'K', 'UNK', 'GO', 'FO', 'DP', 'ROE', 'FC', 'SH', 'SF'];
  // 紙本代號（跟 A4 紀錄表一致）
  const PAPER = { '1B': '1B', '2B': '2B', '3B': '3B', 'HR': 'HR', 'BB': 'BB', 'HBP': 'HBP', 'K': 'K', 'GO': 'GO', 'FO': 'FO', 'DP': 'DP', 'ROE': 'E', 'FC': 'FC', 'SH': 'SH', 'SF': 'SF', 'UNK': '?' };
  const SAFE = { '1B': 1, '2B': 1, '3B': 1, 'HR': 1, 'BB': 1, 'HBP': 1, 'ROE': 1 };

  const RUNK = {
    SB: { label: '盜壘成功' }, CS: { label: '盜壘失敗' }, WP: { label: '暴投' }, PB: { label: '捕逸' },
    PO: { label: '牽制出局' }, BK: { label: '投手犯規' }, E: { label: '失誤進壘' }, ADV: { label: '其他進壘（待分類）' },
  };
  const RUNK_ORDER = ['SB', 'CS', 'WP', 'PB', 'PO', 'E', 'BK', 'ADV'];

  const POS = [['P', '投手', '投'], ['C', '捕手', '捕'], ['1B', '一壘手', '一'], ['2B', '二壘手', '二'], ['3B', '三壘手', '三'],
    ['SS', '游擊手', '游'], ['LF', '左外野手', '左'], ['CF', '中外野手', '中'], ['RF', '右外野手', '右'], ['DH', '指定打擊', '指'], ['EH', '加打', '加']];
  const POS_SHORT = Object.fromEntries(POS.map(p => [p[0], p[2]]));
  const POS_LONG = Object.fromEntries(POS.map(p => [p[0], p[1]]));
  const DIRS = [['LO', '左外'], ['CO', '中外'], ['RO', '右外'], ['LI', '左內'], ['CI', '中內'], ['RI', '右內']];
  const DIR_LABEL = Object.fromEntries(DIRS);
  const SUBK = { PH: '代打', PR: '代跑', DEF: '守備調度', P: '換投' };
  const PITCHK = { B: '壞球', S: '好球', F: '界外', X: '打進場', '+': '球' };

  // ---------- 小工具 ----------
  const sideOf = (game, half) => ((half === 'T') === !!game.weBatFirst ? 'us' : 'opp');
  const other = s => (s === 'us' ? 'opp' : 'us');
  const inScope = (game, side) => (!game.scope || game.scope === 'all') ? true : (game.scope === 'off' ? side === 'us' : side === 'opp');
  const halfKey = (inn, half) => inn * 2 + (half === 'B' ? 1 : 0);
  const halfName = (inn, half) => `${inn}局${half === 'T' ? '上' : '下'}`;
  const uid = p => (p || 'e') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function newBat() { return { G: 0, PA: 0, AB: 0, H: 0, '1B': 0, '2B': 0, '3B': 0, HR: 0, TB: 0, RBI: 0, R: 0, BB: 0, HBP: 0, K: 0, SH: 0, SF: 0, SB: 0, CS: 0, DP: 0, ROE: 0, FC: 0, E: 0 }; }
  function newPit() { return { G: 0, GS: 0, outs: 0, BF: 0, P: 0, PBP: 0, STR: 0, H: 0, HR: 0, BB: 0, HBP: 0, K: 0, R: 0, ER: 0, WP: 0, hasER: false }; }
  function addInto(t, s) { for (const k in s) { if (typeof s[k] === 'number') t[k] = (t[k] || 0) + s[k]; else if (typeof s[k] === 'boolean') t[k] = t[k] || s[k]; } return t; }

  function countOf(ps) {
    let b = 0, s = 0;
    for (const k of ps) {
      if (k === 'B') b++;
      else if (k === 'S') s++;
      else if (k === 'F' && s < 2) s++;
    }
    return { b, s, n: ps.length };
  }

  // ---------- 預設跑者推進 ----------
  // occ: [一壘有人, 二壘有人, 三壘有人]；回傳 map: {B: 去處, 1: 去處, ...}，去處 = 1/2/3/'H'(回本壘)/'X'(出局)
  function defaultMoves(res, occ, outs) {
    const m = {};
    const o = [!!occ[0], !!occ[1], !!occ[2]];
    const forced = [o[0], o[0] && o[1], o[0] && o[1] && o[2]];
    const adv = (b, n) => (b + n >= 4 ? 'H' : b + n);
    const all = n => { for (let b = 1; b <= 3; b++) if (o[b - 1]) m[b] = adv(b, n); };
    const forceAdv = skip => { for (let b = 1; b <= 3; b++) if (o[b - 1] && forced[b - 1] && b !== skip) m[b] = adv(b, 1); };
    const lead = () => (o[0] ? 1 : o[2] ? 3 : o[1] ? 2 : null);
    switch (res) {
      case '1B': m.B = 1; all(1); break;
      case '2B': m.B = 2; all(2); break;
      case '3B': m.B = 3; all(3); break;
      case 'HR': m.B = 'H'; all(3); break;
      case 'BB': case 'HBP': m.B = 1; forceAdv(); break;
      case 'ROE': m.B = 1; all(1); break;
      case 'K': case 'FO': case 'UNK': m.B = 'X'; break;
      case 'GO': m.B = 'X'; forceAdv(); break;
      case 'SH': m.B = 'X'; all(1); break;
      case 'SF': m.B = 'X'; if (o[2]) m[3] = 'H'; break;
      case 'DP': { m.B = 'X'; const l = lead(); if (l) { m[l] = 'X'; forceAdv(l); } break; }
      case 'FC': { m.B = 1; const l = lead(); if (l) { m[l] = 'X'; forceAdv(l); } break; }
      default: m.B = 'X';
    }
    // 第三個出局在同一個 play 發生（封殺／打者出局）時，跑回來的分預設不算
    const outsOnPlay = Object.values(m).filter(v => v === 'X').length;
    if ((outs || 0) + outsOnPlay >= 3 && !SAFE[res]) {
      for (let b = 1; b <= 3; b++) if (m[b] === 'H') delete m[b];
    }
    return m;
  }
  function runsOf(map) { return Object.values(map).filter(v => v === 'H').length; }
  function defaultRbi(res, map) { return (res === 'DP' || res === 'ROE') ? 0 : runsOf(map); }
  function mapToMoves(map, occ) {
    const mv = [];
    if (map.B != null) mv.push({ from: 'B', to: map.B });
    for (let b = 1; b <= 3; b++) if (occ[b - 1] && map[b] != null && map[b] !== b) mv.push({ from: b, to: map[b] });
    return mv;
  }
  function movesToMap(moves) {
    const m = {};
    for (const x of moves || []) m[x.from] = x.to;
    return m;
  }

  // 跑壘事件的預設推進
  function defaultRunMoves(kind, occ) {
    const m = {};
    const o = [!!occ[0], !!occ[1], !!occ[2]];
    const stealer = () => { if (o[0] && !o[1]) return 1; if (o[1] && !o[2]) return 2; if (o[2]) return 3; if (o[0]) return 1; return null; };
    const allUp = () => { for (let b = 3; b >= 1; b--) if (o[b - 1]) m[b] = b === 3 ? 'H' : b + 1; };
    if (kind === 'SB') { const s = stealer(); if (s) m[s] = s === 3 ? 'H' : s + 1; }
    else if (kind === 'CS') { const s = stealer(); if (s) m[s] = 'X'; }
    else if (kind === 'PO') { const s = o[0] ? 1 : o[1] ? 2 : o[2] ? 3 : null; if (s) m[s] = 'X'; }
    else if (kind === 'WP' || kind === 'PB' || kind === 'BK' || kind === 'E') allUp();
    return m;
  }

  // ---------- 狀態 ----------
  function newState(game) {
    const st = {
      inn: 1, half: 'T', side: 'us', outs: 0, bases: [null, null, null],
      score: { us: 0, opp: 0 }, line: { us: [], opp: [] },
      H: { us: 0, opp: 0 }, E: { us: 0, opp: 0 }, LOB: { us: 0, opp: 0 }, outsBy: { us: 0, opp: 0 },
      slot: { us: 0, opp: 0 },
      lineup: (game.lineup || []).map(x => ({ pid: x.pid, pos: x.pos })),
      pitcher: game.startPitcher || null,
      pitchesPA: [], to: 0, halfPlays: 0, over: false, halves: [],
    };
    enterHalf(game, st);
    return st;
  }
  function advanceHalf(st) { if (st.half === 'T') st.half = 'B'; else { st.half = 'T'; st.inn++; } }
  function enterHalf(game, st) {
    let guard = 0;
    while (!inScope(game, sideOf(game, st.half)) && guard++ < 4) advanceHalf(st);
    st.side = sideOf(game, st.half);
    if (st.line[st.side][st.inn - 1] == null) st.line[st.side][st.inn - 1] = 0;
    st.outs = 0; st.bases = [null, null, null]; st.pitchesPA = []; st.to = 0; st.halfPlays = 0;
    st.halves.push({ inn: st.inn, half: st.half, side: st.side });
  }
  function endHalf(game, st) {
    st.LOB[st.side] += st.bases.filter(Boolean).length;
    advanceHalf(st);
    enterHalf(game, st);
  }

  // ---------- 重算 ----------
  function compute(game, opts) {
    opts = opts || {};
    const evs = game.events || [];
    const upto = opts.upto == null ? evs.length : Math.min(opts.upto, evs.length);
    const st = newState(game);
    const bat = {}, pit = {};
    const Bt = pid => bat[pid] || (bat[pid] = newBat());
    const Pt = pid => { const k = pid || '?'; return pit[k] || (pit[k] = newPit()); };
    const appeared = new Set(st.lineup.map(x => x.pid).filter(Boolean));
    const pitched = new Set();
    const log = [], warn = [], pos = [];
    let pendingPitchIdx = [];
    const W = (i, msg) => warn.push({ i, msg });
    const fielder = p => { if (!p) return null; if (p === 'P') return st.pitcher; const f = st.lineup.find(x => x.pos === p); return f ? f.pid : null; };
    const usePitcher = () => { if (st.side === 'opp') pitched.add(st.pitcher || '?'); };

    // 依 moves 移動跑者；batter 為打者跑者（跑壘事件為 null）
    function move(i, moves, batter) {
      const before = st.bases.slice();
      const nb = [null, null, null];
      const scored = [];
      let outs = 0;
      const moved = new Set();
      const place = (r, to) => {
        if (to === 'H') scored.push(r);
        else if (to === 'X') outs++;
        else if (to >= 1 && to <= 3) {
          if (nb[to - 1]) W(i, `${to}壘有兩個跑者`);
          nb[to - 1] = r;
        }
      };
      let batterPlaced = false;
      for (const mv of moves || []) {
        if (mv.from === 'B') {
          if (!batter) continue;
          place(batter, mv.to); batterPlaced = true; continue;
        }
        const r = before[mv.from - 1];
        if (!r) { W(i, `${mv.from}壘上沒有跑者，這筆推進被略過`); continue; }
        moved.add(mv.from);
        place(r, mv.to);
      }
      for (let b = 1; b <= 3; b++) {
        if (before[b - 1] && !moved.has(b)) {
          if (nb[b - 1]) W(i, `${b}壘有兩個跑者`);
          else nb[b - 1] = before[b - 1];
        }
      }
      if (batter && !batterPlaced) { W(i, '打者沒有去處，先當作出局'); outs++; }
      st.bases = nb;
      return { scored, outs, before };
    }

    function scoreRuns(scored, er) {
      const side = st.side;
      st.score[side] += scored.length;
      st.line[side][st.inn - 1] = (st.line[side][st.inn - 1] || 0) + scored.length;
      let erLeft = er || 0;
      for (const r of scored) {
        if (side === 'us') Bt(r.pid).R++;
        else {
          const p = Pt(r.resp); p.R++;
          if (erLeft > 0) { p.ER++; p.hasER = true; erLeft--; }
        }
      }
    }

    function addOuts(i, n) {
      if (!n) return;
      st.outs += n;
      st.outsBy[st.side] += n;
      if (st.side === 'opp') Pt(st.pitcher).outs += n;
      if (st.outs > 3) W(i, '出局數超過 3');
    }

    function afterPlay() {
      if (st.outs >= 3) {
        st.outsBy[st.side] -= Math.max(0, st.outs - 3);
        endHalf(game, st);
      }
    }

    for (let i = 0; i < upto; i++) {
      const e = evs[i];
      pos[i] = { inn: st.inn, half: st.half };
      if (st.over && e.t !== 'END') W(i, '比賽結束後還有紀錄');

      switch (e.t) {
        case 'PITCH': {
          st.pitchesPA.push(e.k);
          pendingPitchIdx.push(i);
          st.halfPlays++;

            usePitcher();
            const p = Pt(st.pitcher); p.P++;

          const nSlots = side === 'us' ? Math.max(1, st.lineup.length) : Math.max(1, game.oppSlots || 9);
          const slot = (e.slot != null ? e.slot : st.slot[side]) % nSlots;
          const pid = side === 'us' ? (st.lineup[slot] ? st.lineup[slot].pid : null) : 'o' + (slot + 1);
          if (side === 'us' && pid) appeared.add(pid);
          if (side === 'opp') usePitcher();
          const batter = { pid, slot, side, resp: side === 'opp' ? (st.pitcher || '?') : null };
          const outsBefore = st.outs;
          const basesBefore = st.bases.map(r => (r ? r.pid : null));
          const { scored, outs } = move(i, e.moves, batter);
          const R = RES[e.res] || RES.UNK;
          // 打者數據

            b.PA++;

            if (e.res === 'SH') b.SH++;
            if (e.res === 'SF') b.SF++;

            i, t: 'PA', id: e.id, inn: pos[i].inn, half: pos[i].half, side, slot, pid, res: e.res, rbi: e.rbi || 0,
            runs: scored.length, scored: scored.map(r => r.pid), outsBefore, outsAfter: Math.min(3, st.outs), basesBefore,
            pitcher: side === 'opp' ? (st.pitcher || '?') : null, pitches: st.pitchesPA.slice(), pitchIdx: pendingPitchIdx.slice(),

            if (e.k === 'CS' && mv.to === 'X') Bt(r.pid).CS++;

          }

          addOuts(i, outs);

    if (o.dir) pa.dir = o.dir;
    if (o.errBy) pa.errBy = o.errBy;
    if (o.er) pa.er = o.er;

  }

  // ---------- 比賽結束提示 ----------

    const home = game.weBatFirst ? 'opp' : 'us', away = other(home);

    if (st.half === 'B') {
      if (fresh) {
        if (st.inn >= fin && lead > 0) out.push({ id: 'homeLead' + st.inn, msg: `後攻領先，${st.inn}局下半不用打，比賽結束` });
        else if (mercy(st.inn) && lead >= mercy(st.inn)) out.push({ id: 'mercyT' + st.inn, msg: `後攻領先 ${lead} 分，符合提前結束（${st.inn}局${mercy(st.inn)}分），下半局不用打` });
      } else {
        if (st.inn >= fin && lead > 0) out.push({ id: 'walkoff' + st.inn, msg: '後攻超前，再見比賽' });
        else if (mercy(st.inn) && lead >= mercy(st.inn)) out.push({ id: 'mercyW' + st.inn, msg: `後攻領先 ${lead} 分，符合提前結束（${st.inn}局${mercy(st.inn)}分）` });
      }

      else if (mercy(done) && diff >= mercy(done)) out.push({ id: 'mercy' + done, msg: `${done}局打完領先 ${diff} 分，符合提前結束（${done}局${mercy(done)}分）` });
    }

  }

  // ---------- 數據格式 ----------
  const ipStr = outs => `${Math.floor((outs || 0) / 3)}.${(outs || 0) % 3}`;
  const f3 = x => (x == null || !isFinite(x) ? '-' : x.toFixed(3).replace(/^0\./, '.'));
  const f2 = x => (x == null || !isFinite(x) ? '-' : x.toFixed(2));
  function batRates(b) {

  }

<script>
/* 工科系棒 比賽紀錄 — 畫面與操作 */
(function () {

        return `${E.SUBK[l.k]}：${plabel(l.in)}${l.out && l.out !== l.in ? `（換下 ${plabel(l.out)}）` : ''}${l.pos ? `・${E.POS_LONG[l.pos]}` : ''}`;
      }
      case 'TO': return `暫停（${l.k === 'in' ? '場內' : '場外'}），本局共 ${l.total}`;
      case 'END': return l.k === 'game' ? '比賽結束' : '手動結束半局';
    }
    return '';
  }

  // ---------- 記錄操作 ----------
  A.pitch = d => {
    if (tooFast() || S.c.st.over) return;
    addEvents([{ t: 'PITCH', k: d.k }]);
    vibrate();
    const cnt = S.c.count;
    if (S.g.modes.pbp && d.k === 'B' && cnt.b >= 4) return quickPA('BB');
    if (S.g.modes.pbp && d.k === 'S' && cnt.s >= 3) return quickPA('K');
    render();
  };
  A.pbpSet = d => {
    S.g.modes.pbp = d.v === '1';
    commit();
    toast(S.g.modes.pbp ? '已改成記好壞球：第 4 個壞球自動記四壞、第 3 個好球自動記三振' : '已改成只記球數（＋1 球）');
    render();
  };
  A.unpitch = () => {
    const ev = S.g.events;
    const idx = S.c.pendingPitchIdx[S.c.pendingPitchIdx.length - 1];
    if (idx == null) return toast('這個打席還沒記任何一球');
    ev.splice(idx, 1); commit(); render();
  };
  A.res = d => {
    if (tooFast()) return;
    const res = d.r, st = S.c.st;
    const why = blockReason(res, st);
    if (why) return toast(why);
    const empty = !st.bases.some(Boolean);
    const needDir = S.g.modes.dir && E.RES[res].bat;
    if (!needDir && res !== 'UNK' && (empty || res === 'K' || res === 'BB' || res === 'HBP')) return quickPA(res);
    openPA('new', res, null);
  };
  function quickPA(res) {
    const before = { inn: S.c.st.inn, half: S.c.st.half };
    const evs = E.makePA(S.g, S.c, res, { slot: curSlot() });
    const added = addEvents(evs);
    S.forceSlot = null;
    vibrate();
    doneToast(S.g.events.indexOf(added[added.length - 1]), before);
    render();
  }
  function doneToast(idx, before) {
    const l = logOf(idx);
    let msg = l ? `已記錄：${descLog(l)}` : '已記錄';
    const st = S.c.st;
    if (before && (before.inn !== st.inn || before.half !== st.half) && !st.over) msg += `｜換 ${E.halfName(st.inn, st.half)}（${st.side === 'us' ? '我方進攻' : '我方防守'}）`;
    toast(msg, [{ label: '修改', a: 'editEv', i: idx }, { label: '復原', a: 'undo' }]);
  }
  A.undo = () => {
    const ev = S.g.events;
    if (!ev.length) return toast('沒有可以復原的紀錄');
    const i = ev.length - 1;
    const last = ev[i];
    const l = logOf(i);
    const desc = last.t === 'PITCH' ? `一球（${E.PITCHK[last.k]}）` : l ? descLog(l) : '一筆紀錄';
    ev.pop();
    if (last.t === 'PA') while (ev.length && ev[ev.length - 1].t === 'PITCH' && ev[ev.length - 1].auto) ev.pop();
    commit();
    S.sheet = null;
    toast(`已復原：${desc}`);
    render();
  };

  // 打席面板
  function ctxAt(idx) {
    const calc = idx == null ? S.c : E.compute(S.g, { upto: idx });
    const st = calc.st;
    return { calc, occ: st.bases.map(Boolean), runners: st.bases.map(r => (r ? r.pid : null)), outs: st.outs, side: st.side, inn: st.inn, half: st.half, lineup: st.lineup, slotDefault: E.currentBatter(S.g, st).slot };
  }
  function openPA(mode, res, idx) {
    const ctx = ctxAt(mode === 'new' ? null : idx);
    const map = E.defaultMoves(res, ctx.occ, ctx.outs);
    S.sheet = { k: 'pa', mode, idx, res, map, rbi: E.defaultRbi(res, map), rbiTouched: false, dir: null, errBy: null, er: 0, note: '', slot: mode === 'new' ? curSlot() : ctx.slotDefault, pitches: [], pitchIdx: [], ctx };
    render();
  }
  A.editEv = d => {
    const i = +d.i, e = S.g.events[i];
    if (!e) return;
    S.toast = null;
    const l = logOf(i);
    if (e.t === 'PA') {
      const ctx = ctxAt(i);
      S.sheet = { k: 'pa', mode: 'edit', idx: i, res: e.res, map: E.movesToMap(e.moves), rbi: e.rbi || 0, rbiTouched: true, dir: e.dir || null, errBy: e.errBy || null, er: e.er || 0, note: e.note || '', slot: l ? l.slot : ctx.slotDefault, pitches: l ? l.pitches.slice() : [], pitchIdx: l ? l.pitchIdx.slice() : [], pitchesOrig: l ? l.pitches.join('') : '', ctx };
    } else if (e.t === 'RUN') {
      const ctx = ctxAt(i);
      S.sheet = { k: 'run', mode: 'edit', idx: i, kind: e.k, map: E.movesToMap(e.moves), errBy: e.errBy || null, er: e.er || 0, note: e.note || '', ctx };
    } else { S.sheet = { k: 'evmenu', i }; }
    render();
  };
  A.paMv = d => { const sh = S.sheet; const from = num(d.from), to = num(d.to); sh.map[from] = to; if (!sh.rbiTouched) sh.rbi = E.defaultRbi(sh.res, sh.map); render(); };
  A.paRes = d => { const sh = S.sheet; sh.res = d.r; sh.map = E.defaultMoves(d.r, sh.ctx.occ, sh.ctx.outs); sh.rbi = E.defaultRbi(d.r, sh.map); render(); };
  A.paRbi = d => { const sh = S.sheet; sh.rbi = Math.max(0, Math.min(4, sh.rbi + +d.d)); sh.rbiTouched = true; render(); };
  A.paEr = d => { const sh = S.sheet; sh.er = Math.max(0, Math.min(4, (sh.er || 0) + +d.d)); render(); };
  A.paDir = d => {
    const sh = S.sheet;
    sh.dir = sh.dir === d.d ? null : d.d;
    if (sh.mode === 'new' && !sh.ctx.occ.some(Boolean) && sh.dir) return A.savePA();
    render();
  };
  A.paErr = d => { const sh = S.sheet; sh.errBy = sh.errBy === d.p ? null : d.p; render(); };
  A.paPitch = d => { const sh = S.sheet; if (d.k === 'del') sh.pitches.pop(); else sh.pitches.push(d.k); render(); };
  A.savePA = () => {
    const sh = S.sheet, g = S.g, occ = sh.ctx.occ;
    const slot = +sh.slot;
    if (sh.mode === 'new') {
      const before = { inn: S.c.st.inn, half: S.c.st.half };
      const evs = E.makePA(g, S.c, sh.res, { map: sh.map, rbi: sh.rbi, dir: sh.dir, slot });
      const added = addEvents(evs);
      S.forceSlot = null; S.sheet = null; vibrate();
      doneToast(g.events.indexOf(added[added.length - 1]), before);
    } else {
      const fields = { res: sh.res, moves: E.mapToMoves(sh.map, occ), rbi: sh.rbi, slot };
      for (const k of ['dir', 'errBy', 'note']) if (sh[k]) fields[k] = sh[k];
      if (sh.er) fields.er = sh.er;
      if (sh.mode === 'insert') {
        const pe = sh.pitches.map(k => ({ t: 'PITCH', k }));
        addEvents([...pe, Object.assign({ t: 'PA' }, fields)], sh.idx);
        toast('已插入打席');
      } else {
        const e = g.events[sh.idx];
        for (const k of ['dir', 'errBy', 'note', 'er']) delete e[k];
        Object.assign(e, fields);
        if (sh.pitches.join('') !== sh.pitchesOrig) {
          const rm = sh.pitchIdx.slice().sort((a, b) => b - a);
          for (const j of rm) g.events.splice(j, 1);
          const at = sh.idx - rm.length;
          g.events.splice(at, 0, ...sh.pitches.map(k => ({ id: E.uid(), t: 'PITCH', k, ts: Date.now(), by: deviceId, inn: e.inn, half: e.half })));
        }
        commit();
        toast('已修改');
      }
      S.sheet = null;
    }
    render();
  };
  function runnerRow(key, label, cur, opts, act) {
    return `<div class="rr"><div class="rl">${esc(label)}</div><div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(o => `<button class="${cur === o ? 'on' : ''} ${o === 'X' ? 'x' : o === 'H' ? 'h' : ''}" data-a="${act}" data-from="${key}" data-to="${o}">${o === key ? '留' : TO_LABEL[o]}</button>`).join('')}</div></div>`;
  }
  const runnerName = pid => (pid ? (isOpp(pid) ? `${pid.slice(1)}棒` : plabel(pid)) : '');
  function stepper(label, v, act) { return `<div class="stp"><span>${label}</span><button data-a="${act}" data-d="-1">−</button><b>${v}</b><button data-a="${act}" data-d="1">＋</button></div>`; }
  function dirPicker(cur) {
    return `<div class="lbl">擊球方向${S.sheet && S.sheet.mode === 'new' && !S.sheet.ctx.occ.some(Boolean) ? '（點一下就存）' : '（可不選）'}</div><div class="field">${E.DIRS.map(([k, v], i) => `<button class="${i < 3 ? 'of' : ''} ${cur === k ? 'on' : ''}" data-a="paDir" data-d="${k}">${v}</button>`).join('')}</div>`;
  }
  function posChips(cur, act, list) {
    return `<div class="chips">${(list || E.POS.slice(0, 9)).map(p => `<button class="chip ${cur === p[0] ? 'on' : ''}" data-a="${act}" data-p="${p[0]}">${p[2]}</button>`).join('')}</div>`;
  }
  function pitchEditor(seq) {
    return `<div class="lbl">這個打席的投球</div><div class="seq">${seq.map(k => `<span>${E.PITCHK[k]}</span>`).join('') || '<span style="background:none" class="mut">沒有</span>'}</div>
    <div class="row">${['B', 'S', 'F', 'X', '+'].map(k => `<button class="btn sm" data-a="paPitch" data-k="${k}">${k === '+' ? '+1球' : E.PITCHK[k]}</button>`).join('')}<button class="btn sm" data-a="paPitch" data-k="del">⌫</button></div>`;
  }
  function sheetPA(sh) {
    const g = S.g, ctx = sh.ctx, occ = ctx.occ, R = E.RES[sh.res];
    const slot = +sh.slot;
    const bname = ctx.side === 'us' ? `${slot + 1}棒 ${plabel((ctx.lineup[slot] || {}).pid)}` : `對手${slot + 1}棒`;
    const title = sh.mode === 'new' ? R.label : sh.mode === 'insert' ? '插入漏記的打席' : '修改打席';
    let h = `<div class="sh-h"><b>${title}</b><button class="x" data-a="closeSheet">✕</button></div><div class="mut">${E.halfName(ctx.inn, ctx.half)}・${ctx.outs} 出局・${esc(bname)}</div>`;
    if (sh.mode !== 'new') {
      h += `<div class="lbl">結果</div><div class="res" style="padding:0">${E.RES_ORDER.map(r => `<button class="rb sm ${E.RES[r].cls} ${r === sh.res ? 'sel' : ''}" data-a="paRes" data-r="${r}">${E.RES[r].short}</button>`).join('')}</div>`;
      const n = ctx.side === 'us' ? Math.max(1, ctx.lineup.length) : (g.oppSlots || 9);
      h += `<label class="f"><span>打者棒次</span><select data-sf="slot">${Array.from({ length: n }, (_, i) => `<option value="${i}" ${i === slot ? 'selected' : ''}>${i + 1}棒${ctx.side === 'us' ? ' ' + esc(plabel((ctx.lineup[i] || {}).pid)) : ''}</option>`).join('')}</select></label>`;
    }
    h += `<div class="lbl">跑者${sh.mode === 'new' ? '（已依結果帶好，不對才點）' : ''}</div>`;
    h += runnerRow('B', `打者 ${bname}`, sh.map.B, [1, 2, 3, 'H', 'X'], 'paMv');
    for (let b = 3; b >= 1; b--) if (occ[b - 1]) h += runnerRow(b, `原${BASE[b]} ${runnerName(ctx.runners[b - 1])}`, sh.map[b] != null ? sh.map[b] : b, [b, ...[1, 2, 3].filter(x => x > b), 'H', 'X'], 'paMv');
    const runs = E.runsOf(sh.map), addO = Object.values(sh.map).filter(v => v === 'X').length;
    h += `<div class="sum">回本壘 <b>${runs}</b> 分・出局 ${ctx.outs} → <b>${Math.min(3, ctx.outs + addO)}</b>${ctx.outs + addO > 3 ? ' <span class="red">出局數超過 3</span>' : ''}${ctx.outs + addO >= 3 && runs ? '<br><span class="mut">第三個出局同時有人回本壘：如果是封殺或打者出局，這分不算，請把跑者改成「留」。</span>' : ''}</div>`;
    if (ctx.side === 'us') h += stepper('打點', sh.rbi, 'paRbi');
    if (R.bat && (g.modes.dir || sh.mode !== 'new')) h += dirPicker(sh.dir);
    if (sh.mode !== 'new') {
      if (sh.res === 'ROE') h += `<div class="lbl">誰失誤${ctx.side === 'us' ? '（對手守位）' : ''}</div>` + posChips(sh.errBy, 'paErr');
      if (ctx.side === 'opp' && runs) h += stepper('其中自責分（選填）', sh.er || 0, 'paEr');
      if (ctx.side === 'opp' || sh.pitches.length || g.modes.pbp) h += pitchEditor(sh.pitches);
      h += `<label class="f"><span>備註</span><input type="text" data-sf="note" value="${esc(sh.note)}"></label>`;
    }
    const skipDir = sh.mode === 'new' && g.modes.dir && R.bat && !occ.some(Boolean);
    h += `<div class="row end">${sh.mode === 'edit' ? `<button class="btn danger" data-a="delEv" data-i="${sh.idx}">刪除</button>` : ''}<button class="btn pri big grow" data-a="savePA">${skipDir ? '不記方向，直接存' : '確認'}</button></div>`;
    return h;
  }

  // 跑壘面板
  A.openRun = d => {
    const st = S.c.st;
    if (st.over) return toast('比賽已結束');
    const kind = (d && d.k) || 'SB';
    const ctx = ctxAt(null);
    S.sheet = { k: 'run', mode: 'new', idx: null, kind, map: E.defaultRunMoves(kind, ctx.occ), errBy: null, er: 0, note: '', ctx };
    render();
  };
  A.runKind = d => { const sh = S.sheet; sh.kind = d.k; sh.map = E.defaultRunMoves(d.k, sh.ctx.occ); render(); };
  A.runMv = d => { S.sheet.map[num(d.from)] = num(d.to); render(); };
  A.runErr = d => { const sh = S.sheet; sh.errBy = sh.errBy === d.p ? null : d.p; render(); };
  A.saveRun = () => {
    const sh = S.sheet, occ = sh.ctx.occ;
    const moves = E.mapToMoves(sh.map, occ);
    if (!moves.length && sh.mode !== 'edit') return toast('沒有跑者移動；點跑者要去的壘');
    const fields = { k: sh.kind, moves };
    if (sh.errBy) fields.errBy = sh.errBy;
    if (sh.note) fields.note = sh.note;
    if (sh.mode === 'new') { const before = { inn: S.c.st.inn, half: S.c.st.half }; const a = addEvents([Object.assign({ t: 'RUN' }, fields)]); S.sheet = null; doneToast(S.g.events.indexOf(a[0]), before); }
    else if (sh.mode === 'insert') { addEvents([Object.assign({ t: 'RUN' }, fields)], sh.idx); S.sheet = null; toast('已插入'); }
    else { const e = S.g.events[sh.idx]; delete e.errBy; delete e.note; Object.assign(e, fields); commit(); S.sheet = null; toast('已修改'); }
    render();
  };
  function sheetRun(sh) {
    const ctx = sh.ctx, occ = ctx.occ;
    let h = `<div class="sh-h"><b>${sh.mode === 'edit' ? '修改跑壘' : sh.mode === 'insert' ? '插入跑壘' : '跑壘／調整壘包'}</b><button class="x" data-a="closeSheet">✕</button></div><div class="mut">${E.halfName(ctx.inn, ctx.half)}・${ctx.outs} 出局</div>`;
    h += `<div class="chips" style="margin-top:10px">${E.RUNK_ORDER.map(k => `<button class="chip ${sh.kind === k ? 'on' : ''}" data-a="runKind" data-k="${k}">${E.RUNK[k].label}</button>`).join('')}</div>`;
    if (sh.kind === 'ADV') h += `<div class="mut" style="margin-top:6px">來不及看清楚就用這個：直接把跑者改到正確的壘，賽後再補是盜壘還是暴投。</div>`;
    if (!occ.some(Boolean)) {
      h += `<div class="banner">壘上沒有跑者。如果是漏記了打席，請補一個打席。<div class="row"><button class="btn sm pri" data-a="insUNKnow">補一個漏記的打席</button></div></div>`;
      return h;
    }
    for (let b = 3; b >= 1; b--) if (occ[b - 1]) h += runnerRow(b, `${BASE[b]} ${runnerName(ctx.runners[b - 1])}`, sh.map[b] != null ? sh.map[b] : b, [b, ...[1, 2, 3].filter(x => x > b), 'H', 'X'], 'runMv');
    if (sh.kind === 'E') h += `<div class="lbl">誰失誤（可賽後補）</div>` + posChips(sh.errBy, 'runErr');
    if (sh.mode !== 'new') h += `<label class="f"><span>備註</span><input type="text" data-sf="note" value="${esc(sh.note)}"></label>`;
    h += `<div class="row end">${sh.mode === 'edit' ? `<button class="btn danger" data-a="delEv" data-i="${sh.idx}">刪除</button>` : ''}<button class="btn pri big grow" data-a="saveRun">確認</button></div>`;
    return h;
  }
  A.insUNKnow = () => openPA('new', 'UNK', null);

  // 換人面板
  A.openSub = d => {
    const st = S.c.st;
    const kind = (d && d.k) || (st.side === 'us' ? 'PH' : 'P');
    const firstUsBase = [1, 2, 3].find(b => st.bases[b - 1] && st.bases[b - 1].side === 'us') || 1;
    S.sheet = { k: 'sub', kind, slot: st.side === 'us' ? curSlot() : 0, base: firstUsBase, pid: null, pos: null };
    render();
  };
  A.subKind = d => { S.sheet.kind = d.k; S.sheet.pid = null; S.sheet.pos = null; render(); };
  A.subSlot = d => { S.sheet.slot = +d.s; S.sheet.pid = null; render(); };
  A.subBase = d => { S.sheet.base = +d.b; render(); };
  A.subPid = d => { S.sheet.pid = d.id; render(); };
  A.subPos = d => { S.sheet.pos = S.sheet.pos === d.p ? null : d.p; render(); };
  function sheetSub(sh) {
    const st = S.c.st;
    const inLineup = new Set(st.lineup.map(l => l.pid));
    const bench = activeRoster().filter(p => !inLineup.has(p.id));
    const pbtn = (p, on) => `<button class="${on ? 'on' : ''}" data-a="subPid" data-id="${p.id}">#${esc(p.no)} ${esc(p.name)}${p.isP ? ' <small>投</small>' : ''}</button>`;
    let h = `<div class="sh-h"><b>換人</b><button class="x" data-a="closeSheet">✕</button></div>`;
    h += `<div class="chips" style="margin-top:8px">${Object.entries(E.SUBK).map(([k, v]) => `<button class="chip ${sh.kind === k ? 'on' : ''}" data-a="subKind" data-k="${k}">${v}</button>`).join('')}</div>`;
    const slots = () => `<div class="lbl">哪一棒</div><div class="chips">${st.lineup.map((l, i) => `<button class="chip ${sh.slot === i ? 'on' : ''}" data-a="subSlot" data-s="${i}">${i + 1}棒 ${esc(plabelShort(l.pid))}</button>`).join('') || '<span class="mut">沒有打序</span>'}</div>`;
    if (sh.kind === 'PH') {
      h += slots() + `<div class="lbl">上場打擊</div><div class="pgrid">${bench.map(p => pbtn(p, sh.pid === p.id)).join('') || '<span class="mut">板凳沒有人</span>'}</div><div class="lbl">之後守位（可不選）</div>` + posChips(sh.pos, 'subPos', E.POS);

      h += `<div class="lbl">代跑球員</div><div class="pgrid">${bench.map(p => pbtn(p, sh.pid === p.id)).join('')}</div>`;
    } else if (sh.kind === 'DEF') {
      const cur = st.lineup[sh.slot];
      h += slots() + `<div class="lbl">換成誰（不換人就選原本的人）</div><div class="pgrid">${cur && cur.pid ? pbtn(P(cur.pid) || { id: cur.pid, no: '?', name: '原球員' }, sh.pid === cur.pid) : ''}${bench.map(p => pbtn(p, sh.pid === p.id)).join('')}</div><div class="lbl">守位</div>` + posChips(sh.pos, 'subPos', E.POS);

      h += `<div class="lbl">新投手（目前 ${esc(plabel(st.pitcher))}）</div><div class="pgrid">${all.filter(p => p.id !== st.pitcher).map(p => pbtn(p, sh.pid === p.id)).join('')}</div>`;

  }
  A.saveSub = () => {
    const sh = S.sheet, st = S.c.st;
    const e = { t: 'SUB', k: sh.kind };
    if (sh.kind === 'PH') { if (!sh.pid) return toast('請選上場打擊的球員'); e.slot = sh.slot; e.in = sh.pid; if (sh.pos) e.pos = sh.pos; if (st.side === 'us' && sh.slot !== E.currentBatter(S.g, st).slot) S.forceSlot = null; }
    else if (sh.kind === 'PR') { if (!st.bases[sh.base - 1] || st.bases[sh.base - 1].side !== 'us') return toast('那個壘上沒有我方跑者'); if (!sh.pid) return toast('請選代跑球員'); e.base = sh.base; e.in = sh.pid; }
    else if (sh.kind === 'DEF') { if (!sh.pid && !sh.pos) return toast('請選球員或守位'); e.slot = sh.slot; e.in = sh.pid || (st.lineup[sh.slot] || {}).pid; if (sh.pos) e.pos = sh.pos; }
    else { if (!sh.pid) return toast('請選新投手'); e.in = sh.pid; }
    const a = addEvents([e]);
    S.sheet = null;
    toast(`已記錄：${descLog(logOf(S.g.events.indexOf(a[0])))}`, [{ label: '復原', a: 'undo' }]);
    render();
  };

  // 打者、暫停、選單
  A.pickBatter = () => { S.sheet = { k: 'batter' }; render(); };
  function sheetBatter() {
    const g = S.g, st = S.c.st;
    const n = st.side === 'us' ? st.lineup.length : (g.oppSlots || 9);
    const cur = curSlot();
    return `<div class="sh-h"><b>這個打席是誰</b><button class="x" data-a="closeSheet">✕</button></div><div class="mut">只在棒次對不上時用（例如漏記了一個打席，建議改用「紀錄」插入）。</div>
    <div class="pgrid" style="margin-top:10px">${Array.from({ length: n }, (_, i) => `<button class="${i === cur ? 'on' : ''}" data-a="setBatter" data-s="${i}">${i + 1}棒${st.side === 'us' ? ' ' + esc(plabel((st.lineup[i] || {}).pid)) : ''}</button>`).join('')}</div>`;
  }
  A.setBatter = d => { S.forceSlot = { side: S.c.st.side, slot: +d.s }; S.sheet = null; render(); };
  A.openTO = () => { S.sheet = { k: 'to' }; render(); };
  function sheetTO() {
    const st = S.c.st;
    return `<div class="sh-h"><b>叫暫停</b><button class="x" data-a="closeSheet">✕</button></div><div class="mut">秩序冊：每局暫停超過兩次就要換投手。場內球員叫算半次，場外算一次。</div>
    <div class="big-score">本局 ${st.to} 次</div><div class="row"><button class="btn big grow" data-a="addTO" data-k="in">場內暫停 +0.5</button><button class="btn big grow" data-a="addTO" data-k="out">場外暫停 +1</button></div>`;
  }
  A.addTO = d => { addEvents([{ t: 'TO', k: d.k }]); S.sheet = null; const t = S.c.st.to; toast(t > 2 ? `本局暫停 ${t} 次，超過兩次要換投手` : `本局暫停 ${t} 次`, [{ label: '復原', a: 'undo' }]); render(); };
  A.menu = () => { S.sheet = { k: 'menu' }; render(); };
  function sheetMenu() {
    const g = S.g, st = S.c.st;
    const started = g.startedAt ? new Date(g.startedAt) : null;
    return `<div class="sh-h"><b>比賽選單</b><button class="x" data-a="closeSheet">✕</button></div>
    <div class="lbl">選記項目</div><div class="chips"><button class="chip ${g.modes.pbp ? 'on' : ''}" data-a="togMode" data-k="pbp">逐球（好壞球）</button><button class="chip ${g.modes.dir ? 'on' : ''}" data-a="togMode" data-k="dir">擊球方向</button></div>
    <div class="lbl">比賽時間</div><div class="mut">${started ? `開始 ${pad2(started.getHours())}:${pad2(started.getMinutes())}・限時 ${g.timeLimit} 分鐘` : '還沒開始計時'}</div>
    <div class="row" style="margin-top:6px"><button class="btn sm" data-a="startClock">從現在開始計時</button><button class="btn sm ${g.timeLimit === 120 ? 'on' : ''}" data-a="setLimit" data-v="120">120 分</button><button class="btn sm ${g.timeLimit === 150 ? 'on' : ''}" data-a="setLimit" data-v="150">150 分</button></div>
    <div class="lbl">最後一局</div><div class="row">${g.lastInning ? `<span>目前設定：第 ${g.lastInning} 局</span><button class="btn sm" data-a="clearLast">取消</button>` : `<button class="btn sm" data-a="setLast">設第 ${st.inn} 局為最後一局</button>`}</div>
    <div class="lbl">其他</div>
    <div class="row"><button class="btn" data-a="nav" data-v="box">比賽結果・輸出</button><button class="btn" data-a="editSetup">賽前設定・打序</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-a="askEndHalf">手動結束本半局</button><button class="btn danger" data-a="askEndGame">結束比賽</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-a="nav" data-v="home">回首頁</button></div>`;
  }
  A.togMode = d => { S.g.modes[d.k] = !S.g.modes[d.k]; commit(); render(); };
  A.startClock = () => { S.g.startedAt = Date.now(); delete S.dismissed.time; commit(); toast('已從現在開始計時'); render(); };
  A.setLimit = d => { S.g.timeLimit = +d.v; commit(); render(); };
  A.setLast = () => { S.g.lastInning = S.c.st.inn; commit(); S.sheet = null; toast(`第 ${S.g.lastInning} 局為最後一局，打完就結束`); render(); };
  A.clearLast = () => { S.g.lastInning = null; commit(); render(); };
  A.dismiss = d => { S.dismissed[d.id] = true; render(); };
  A.askEndHalf = () => confirmAsk(`確定要結束 ${E.halfName(S.c.st.inn, S.c.st.half)}？（出局數沒到 3 也會換半局，例如時間到）`, '結束本半局', () => { addEvents([{ t: 'END', k: 'half' }]); toast('已結束半局', [{ label: '復原', a: 'undo' }]); });
  A.askEndGame = () => confirmAsk('確定比賽結束？之後還可以按「取消結束」繼續記。', '結束比賽', () => A.endGame());
  A.endGame = () => { addEvents([{ t: 'END', k: 'game' }]); S.sheet = null; go('box'); toast('比賽結束，記得備份', [{ label: '取消結束', a: 'undoEnd' }]); };
  A.undoEnd = () => { const ev = S.g.events; if (ev.length && ev[ev.length - 1].t === 'END' && ev[ev.length - 1].k === 'game') { ev.pop(); commit(); go('live'); } };

  // 確認視窗
  function confirmAsk(msg, yes, fn, danger) { S.sheet = { k: 'confirm', msg, yes, danger }; S.confirmFn = fn; render(); }
  A.confirmYes = () => { const fn = S.confirmFn; S.sheet = null; S.confirmFn = null; if (fn) fn(); render(); };
  A.closeSheet = () => { S.sheet = null; render(); };

  // ---------- 紀錄列表 ----------
  VIEWS.log = () => {
    const g = S.g, c = S.c;
    if (!g) return VIEWS.home();
    const warnBy = {};
    for (const w of c.warn) (warnBy[w.i] = warnBy[w.i] || []).push(w.msg);
    const pend = new Set(pendingItems(g, c).map(p => p.i));

    h += `<div class="mut pad" style="padding-bottom:0">點任何一筆可以修改、刪除，或在它前面插入漏記的打席。</div>`;
    let lastKey = null;
    const T = settings.teamName, O = g.opp || '對手';
    const halfRuns = (inn, half) => { const side = E.sideOf(g, half); const v = c.st.line[side][inn - 1]; return v == null ? '' : `${v} 分`; };

      const key = l.inn + l.half;
      if (key !== lastKey) { lastKey = key; h += `<div class="half-h"><span>${E.halfName(l.inn, l.half)}・${E.sideOf(g, l.half) === 'us' ? esc(T) + '進攻' : esc(O) + '進攻'}</span><span>${halfRuns(l.inn, l.half)}</span></div>`; }
      const pit = l.t === 'PA' && l.pitches.length ? `<div class="mut">${l.pitches.map(k => E.PITCHK[k]).join(' ')}</div>` : '';
      const w = warnBy[l.i] ? `<div class="red">⚠ ${esc(warnBy[l.i].join('；'))}</div>` : '';
      h += `<button class="li" data-a="evMenu" data-i="${l.i}"><span>${esc(descLog(l))}${pend.has(l.i) ? '<span class="badge">待補</span>' : ''}${pit}${w}</span><span class="mut">›</span></button>`;
    }
    if (c.pendingPitchIdx.length) h += `<div class="li"><span class="mut">進行中的打席：已投 ${c.pendingPitchIdx.length} 球</span></div>`;
    if (!c.log.length) h += `<p class="pad mut">還沒有紀錄。</p>`;
    return h;
  };
  A.evMenu = d => { S.sheet = { k: 'evmenu', i: +d.i }; render(); };
  function sheetEvMenu(sh) {
    const e = S.g.events[sh.i], l = logOf(sh.i);
    if (!e) return '';
    const canEdit = e.t === 'PA' || e.t === 'RUN';
    return `<div class="sh-h"><b>${l ? esc(E.halfName(l.inn, l.half)) : ''}</b><button class="x" data-a="closeSheet">✕</button></div><div style="margin:6px 0 12px;font-weight:700">${l ? esc(descLog(l)) : ''}</div>
    <div class="row">${canEdit ? `<button class="btn pri grow" data-a="editEv" data-i="${sh.i}">修改</button>` : ''}<button class="btn grow" data-a="insPA" data-i="${sh.i}">在這筆前插入打席</button><button class="btn grow" data-a="insRun" data-i="${sh.i}">在這筆前插入跑壘</button><button class="btn danger grow" data-a="delEv" data-i="${sh.i}">刪除這筆</button></div>`;
  }
  function insertPoint(i) {
    // 插在這筆打席的投球之前
    const l = logOf(i);
    return l && l.t === 'PA' && l.pitchIdx.length ? Math.min(...l.pitchIdx) : i;
  }
  A.insPA = d => { openPA('insert', 'UNK', insertPoint(+d.i)); };
  A.insRun = d => { const at = +d.i; const ctx = ctxAt(at); S.sheet = { k: 'run', mode: 'insert', idx: at, kind: 'ADV', map: {}, errBy: null, note: '', ctx }; render(); };
  A.insertAtEnd = () => { go('live'); openPA('new', 'UNK', null); };
  A.delEv = d => {
    const i = +d.i, l = logOf(i);
    confirmAsk(`刪除「${l ? descLog(l) : '這筆紀錄'}」？後面的比分、壘包會重新計算。`, '刪除', () => {
      const ev = S.g.events;
      const rm = l && l.t === 'PA' ? [...l.pitchIdx, i] : [i];
      rm.sort((a, b) => b - a).forEach(j => ev.splice(j, 1));
      commit(); toast('已刪除');
    }, true);
  };

  // ---------- 待補登 ----------
  function pendingItems(g, c) {
    const out = [];
    for (const l of c.log) {
      if (l.t === 'PA' && l.res === 'UNK') out.push({ i: l.i, msg: `${E.halfName(l.inn, l.half)} ${l.side === 'us' ? plabel(l.pid) : `對手${l.slot + 1}棒`}：沒看到的打席，結果待補` });
      if (l.t === 'PA' && l.res === 'ROE' && l.side === 'opp' && !l.errBy) out.push({ i: l.i, msg: `${E.halfName(l.inn, l.half)} 對手${l.slot + 1}棒失誤上壘：誰失誤？` });
      if (l.t === 'RUN' && l.k === 'ADV') out.push({ i: l.i, msg: `${E.halfName(l.inn, l.half)} 跑者推進：盜壘／暴投／捕逸／失誤？` });
      if (l.t === 'RUN' && l.k === 'E' && l.side === 'opp' && !l.errBy) out.push({ i: l.i, msg: `${E.halfName(l.inn, l.half)} 失誤進壘：誰失誤？` });
    }
    for (const w of c.warn) out.push({ i: w.i, msg: `⚠ ${w.msg}`, warn: true });
    return out;
  }

  // ---------- 比賽結果 ----------
  function innCount(c) { return Math.max(7, c.st.line.us.length, c.st.line.opp.length); }
  function lineScore(g, c) {
    const n = innCount(c);
    const T = settings.teamName, O = g.opp || '對手';
    const rows = g.weBatFirst ? [['us', T], ['opp', O]] : [['opp', O], ['us', T]];
    return `<div class="scroll"><table class="tbl"><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr>` +
      rows.map(([s, name]) => `<tr><td class="l">${esc(name)}</td>${Array.from({ length: n }, (_, i) => `<td>${c.st.line[s][i] == null ? '' : c.st.line[s][i]}</td>`).join('')}<td class="big">${c.st.score[s]}</td><td>${c.st.H[s]}</td><td>${c.st.E[s]}</td></tr>`).join('') + `</table></div>`;
  }
  function battingOrder(g, c) {
    // 依棒次排：先發，再接替補
    const order = [];
    const seen = new Set();
    const bySlot = {};
    (g.lineup || []).forEach((l, i) => { if (l.pid) (bySlot[i] = bySlot[i] || []).push(l.pid); });
    for (const l of c.log) if (l.t === 'SUB' && l.k !== 'P' && l.in && l.slot != null) (bySlot[l.slot] = bySlot[l.slot] || []).push(l.in);
    Object.keys(bySlot).sort((a, b) => a - b).forEach(s => bySlot[s].forEach(pid => { if (!seen.has(pid)) { seen.add(pid); order.push({ pid, slot: +s }); } }));
    for (const pid of Object.keys(c.bat)) if (!seen.has(pid) && (c.bat[pid].PA || c.bat[pid].R || c.bat[pid].E)) order.push({ pid, slot: null });
    return order;
  }
  function pitcherOrder(g, c) {
    const out = [];
    const add = p => { if (p && c.pit[p] && !out.includes(p)) out.push(p); };
    add(g.startPitcher || '?');
    for (const l of c.log) if (l.t === 'SUB' && l.k === 'P') add(l.in);
    for (const p of Object.keys(c.pit)) add(p);
    return out;
  }
  function paResultsByPid(c) {
    const m = {};
    for (const l of c.log) if (l.t === 'PA' && l.side === 'us' && l.pid) (m[l.pid] = m[l.pid] || []).push(E.RES[l.res].short);
    return m;
  }
  function batTable(rows, tot) {
    const cols = ['PA', 'AB', 'H', '2B', '3B', 'HR', 'RBI', 'R', 'BB', 'HBP', 'K', 'SB'];
    const head = ['打席', '打數', '安打', '二安', '三安', '全壘打', '打點', '得分', '四壞', '觸身', '三振', '盜壘'];
    const tr = (b, name, extra, cls) => { const r = E.batRates(b); return `<tr class="${cls || ''}"><td class="l">${name}</td>${cols.map(k => `<td>${b[k] || 0}</td>`).join('')}<td>${E.f3(r.AVG)}</td><td>${E.f3(r.OBP)}</td><td>${E.f3(r.SLG)}</td><td>${E.f3(r.OPS)}</td>${extra != null ? `<td class="l">${extra}</td>` : ''}</tr>`; };
    const hasExtra = rows.some(r => r.extra != null);
    return `<div class="scroll"><table class="tbl"><tr><th>球員</th>${head.map(x => `<th>${x}</th>`).join('')}<th>打擊率</th><th>上壘率</th><th>長打率</th><th>OPS</th>${hasExtra ? '<th>各打席</th>' : ''}</tr>${rows.map(r => tr(r.b, r.name, hasExtra ? (r.extra || '') : null)).join('')}${tot ? tr(tot, '合計', hasExtra ? '' : null, 'tot') : ''}</table></div>`;
  }
  function pitTable(rows) {
    const N = settings.perN;
    return `<div class="scroll"><table class="tbl"><tr><th>投手</th><th>局數</th><th>用球數</th><th>面對打者</th><th>被安打</th><th>被全壘打</th><th>四壞</th><th>觸身</th><th>三振</th><th>失分</th><th>WHIP</th><th>每${N}局失分</th><th>K/BB</th><th>好球率</th>${rows.some(r => r.p.hasER) ? '<th>自責分</th>' : ''}</tr>` +
      rows.map(({ p, name }) => { const r = E.pitRates(p, N); return `<tr><td class="l">${name}</td><td>${E.ipStr(p.outs)}</td><td>${p.P}</td><td>${p.BF}</td><td>${p.H}</td><td>${p.HR}</td><td>${p.BB}</td><td>${p.HBP}</td><td>${p.K}</td><td>${p.R}</td><td>${E.f2(r.WHIP)}</td><td>${E.f2(r.RPN)}</td><td>${r.KBB === Infinity ? '∞' : E.f2(r.KBB)}</td><td>${r.STRP == null ? '-' : Math.round(r.STRP * 100) + '%'}</td>${rows.some(x => x.p.hasER) ? `<td>${p.hasER ? p.ER : '-'}</td>` : ''}</tr>`; }).join('') + `</table></div>`;
  }
  VIEWS.box = () => {
    const g = S.g, c = S.c;
    if (!g) return VIEWS.home();
    const T = settings.teamName, O = g.opp || '對手';
    const us = c.st.score.us, op = c.st.score.opp;
    const over = c.st.over;
    const r = !over ? '進行中' : us > op ? '勝' : us < op ? '敗' : '和';
    const pend = pendingItems(g, c);
    const res = paResultsByPid(c);
    const order = battingOrder(g, c);
    const tot = E.newBat();
    order.forEach(o => E.addInto(tot, c.bat[o.pid] || E.newBat()));
    let h = topbar('比賽結果', over ? 'home' : 'live');
    h += `<div class="pad"><div class="mut">${esc(g.date)}・${esc(g.field || '')}・${g.weBatFirst ? '先攻' : '後攻'}${g.scope !== 'all' ? '・' + SCOPE[g.scope] : ''}</div>
      <div class="big-score">${esc(T)} ${us} : ${op} ${esc(O)}　<span class="${r === '勝' ? 'w' : r === '敗' ? 'l' : ''}">${r}</span></div>${lineScore(g, c)}
      <div class="mut">殘壘：${esc(T)} ${c.st.LOB.us}・${esc(O)} ${c.st.LOB.opp}</div>`;
    if (pend.length) h += `<h2>待補登（${pend.length}）</h2><div class="list">${pend.map(p => `<button class="li" data-a="editEv" data-i="${p.i}"><span class="${p.warn ? 'red' : ''}">${esc(p.msg)}</span><span>›</span></button>`).join('')}</div>`;
    h += `<h2>輸出</h2><div class="row"><button class="btn pri" data-a="lineSum">LINE 摘要</button><button class="btn" data-a="csvGame" data-k="bat">CSV 打擊</button><button class="btn" data-a="csvGame" data-k="pit">CSV 投球</button><button class="btn" data-a="csvGame" data-k="pbp">CSV 逐打席</button><button class="btn" data-a="exportGame">傳給另一台／備份（JSON）</button><button class="btn" data-a="paper" data-id="${g.id}">列印紀錄表</button></div>`;
    h += `<h2>${esc(T)} 打擊</h2>` + batTable(order.map(o => ({ b: c.bat[o.pid] || E.newBat(), name: `${o.slot != null ? o.slot + 1 + '. ' : ''}${esc(plabel(o.pid))}`, extra: (res[o.pid] || []).join(' ') })), tot);
    const pits = pitcherOrder(g, c);
    if (pits.length) h += `<h2>${esc(T)} 投球</h2>` + pitTable(pits.map(p => ({ p: c.pit[p], name: esc(plabel(p)) })));
    h += `<div class="row end">${over ? '<button class="btn" data-a="undoEnd">重新開啟記錄</button>' : '<button class="btn pri" data-a="nav" data-v="live">回記錄畫面</button><button class="btn" data-a="askEndGame">結束比賽</button>'}<button class="btn danger" data-a="askDelGame">刪除這場</button></div></div>`;
    return h;
  };
  A.askDelGame = () => confirmAsk(`刪除「${S.g.date} vs ${S.g.opp}」整場紀錄？刪了就救不回來（除非有 JSON 備份）。`, '刪除整場', () => { deleteGame(S.g.id); S.g = null; S.c = null; go('home'); toast('已刪除'); }, true);

  // LINE 摘要
  function batLine(b) {
    const parts = [];
    parts.push(b.AB ? `${b.AB}打數${b.H}安打` : `${b.PA}打席`);
    const ex = [];
    if (b['2B']) ex.push(b['2B'] > 1 ? `二安×${b['2B']}` : '二安');
    if (b['3B']) ex.push(b['3B'] > 1 ? `三安×${b['3B']}` : '三安');
    if (b.HR) ex.push(b.HR > 1 ? `全壘打×${b.HR}` : '全壘打');
    if (ex.length) parts.push(`（${ex.join('、')}）`);
    if (b.RBI) parts.push(` ${b.RBI}打點`);
    if (b.R) parts.push(` ${b.R}得分`);
    if (b.BB) parts.push(` ${b.BB}四壞`);
    if (b.SB) parts.push(` ${b.SB}盜壘`);
    return parts.join('');
  }
  function lineSummary(g, c) {
    const T = settings.teamName, O = g.opp || '對手';
    const us = c.st.score.us, op = c.st.score.opp;
    const r = c.st.over ? (us > op ? '勝' : us < op ? '敗' : '和') : '進行中';
    const n = Math.max(c.st.line.us.length, c.st.line.opp.length);
    const row = s => Array.from({ length: n }, (_, i) => (c.st.line[s][i] == null ? '-' : c.st.line[s][i])).join(' ');
    const sides = g.weBatFirst ? [['us', T], ['opp', O]] : [['opp', O], ['us', T]];
    const L = [];
    L.push(`⚾ ${mmdd(g.date)} 棒聯｜${T} vs ${O}`);
    L.push(`${T} ${us} : ${op} ${O}（${r}）`);
    if (g.field) L.push(`📍 ${g.field}`);

    let used = 0;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('kbb1_')) used += (localStorage.getItem(k) || '').length; } } catch (e) { }
    const num = (k, label, min, max) => `<label class="f"><span>${label}</span><input type="number" inputmode="numeric" min="${min}" max="${max}" data-set="${k}" value="${esc(settings[k])}"></label>`;
    return `${topbar('備份・匯入・設定')}<div class="pad">
      <h2 style="margin-top:4px">備份與合併</h2>
      <div class="mut">換手機、兩支手機分工記錄時：一支按「匯出全部」，傳到另一支後按「匯入」，同一場比賽會自動合併。</div>
      <div class="row" style="margin-top:8px"><button class="btn pri" data-a="exportAll">匯出全部（JSON）</button><label class="btn">匯入 JSON<input type="file" accept=".json,application/json" data-file="1" style="display:none"></label></div>
      <h2>紙本</h2><div class="row"><button class="btn" data-a="paper" data-id="">列印空白紀錄表</button></div>
      <h2>設定</h2>
      <label class="f"><span>隊名（顯示用）</span><input type="text" data-set="teamName" value="${esc(settings.teamName)}"></label>
      <label class="f"><span>預設場地</span><input type="text" data-set="venue" value="${esc(settings.venue)}"></label>
      <div class="row">${num('warnY', '用球數超過幾球變黃', 10, 200)}${num('warnR', '超過幾球變紅', 10, 200)}</div>
      <div class="row">${num('perN', '每幾局失分（棒聯 7 局制）', 1, 9)}${num('timeWarn', '時間到前幾分鐘提醒宣布最後一局', 1, 60)}</div>
      <div class="row">${num('minPA', '排行榜：每場規定打席', 0, 10)}${num('minIP', '排行榜：每場規定投球局數', 0, 9)}</div>
      <div class="mut">設定改完會自動存。這支手機的資料大約 ${(used / 1024).toFixed(0)} KB。</div>
      <h2>危險區</h2><button class="btn danger" data-a="askWipe">清除這支手機的所有資料</button></div>`;
  };
  A.exportAll = async () => {
    const name = `${safe(settings.teamName)}系棒_備份_${today()}.json`;
    const text = exportPayload(allGames());
    if (await shareFile(name, text, 'application/json')) return;
    download(name, text, 'application/json');
  };
  A.askWipe = () => confirmAsk('清除這支手機上所有球員、比賽和設定？請先確定已經匯出備份。', '全部清除', () => {
    try { Object.keys(localStorage).filter(k => k.startsWith('kbb1_')).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    roster = []; index = []; settings = Object.assign({}, DEF); S.g = null; S.c = null; go('home'); toast('已清除');
  }, true);

  // ---------- 球員編輯 ----------
  A.editPlayer = d => {
    const p = d && d.id ? P(d.id) : null;
    S.sheet = { k: 'player', p: p ? Object.assign({}, p) : { id: null, no: '', name: '', pos: '', isP: false, active: true } };
    render();
  };
  function sheetPlayer(sh) {
    const p = sh.p;
    return `<div class="sh-h"><b>${p.id ? '編輯球員' : '新增球員'}</b><button class="x" data-a="closeSheet">✕</button></div>
    <div class="row"><label class="f" style="width:110px"><span>背號</span><input type="number" inputmode="numeric" data-sf="p.no" value="${esc(p.no)}"></label><label class="f grow"><span>姓名</span><input type="text" data-sf="p.name" value="${esc(p.name)}"></label></div>
    <div class="lbl">常守位</div>${posChips(p.pos, 'plPos', E.POS.slice(0, 9))}
    <div class="chips" style="margin-top:12px"><button class="chip ${p.isP ? 'on' : ''}" data-a="plTog" data-k="isP">會投球</button><button class="chip ${p.active !== false ? 'on' : ''}" data-a="plTog" data-k="active">在隊上</button></div>
    ${sh.err ? `<div class="err">${esc(sh.err)}</div>` : ''}
    <div class="row end">${p.id ? '<button class="btn danger" data-a="delPlayer">刪除</button>' : ''}<button class="btn pri big grow" data-a="savePlayer">儲存</button></div>`;
  }
  A.plPos = d => { const p = S.sheet.p; p.pos = p.pos === d.p ? '' : d.p; render(); };
  A.plTog = d => { const p = S.sheet.p; p[d.k] = d.k === 'active' ? p.active === false : !p[d.k]; render(); };
  A.savePlayer = () => {
    const sh = S.sheet, p = sh.p;
    p.name = String(p.name || '').trim();
    if (!p.name) { sh.err = '請填姓名'; return render(); }
    if (p.no === '' || p.no == null) { sh.err = '請填背號'; return render(); }
    const dup = roster.find(x => x.id !== p.id && String(x.no) === String(p.no) && x.active !== false);
    if (dup && p.active !== false) { sh.err = `背號 ${p.no} 已經是 ${dup.name}`; return render(); }
    if (p.id) { const i = roster.findIndex(x => x.id === p.id); roster[i] = p; }
    else { p.id = E.uid('pl'); roster.push(p); }
    saveRoster(); S.sheet = null; toast('已儲存'); render();
  };
  A.delPlayer = () => {
    const p = S.sheet.p;
    confirmAsk(`刪除 #${p.no} ${p.name}？已經記錄的比賽會顯示成「已刪除的球員」。如果只是離隊，建議改成「不在隊上」。`, '刪除', () => { roster = roster.filter(x => x.id !== p.id); saveRoster(); }, true);
  };
  A.bulkPlayers = () => { S.sheet = { k: 'bulk', text: '' }; render(); };
  function sheetBulk(sh) {
    return `<div class="sh-h"><b>整批貼上名單</b><button class="x" data-a="closeSheet">✕</button></div>
    <div class="mut">一行一位：背號 姓名 守位（守位可省略；「投」或「P」開頭的守位會標成會投球）。例：<br>7 陳大同 游<br>18 王小明 投<br>3 張家銘 二</div>
    <textarea data-sf="text" placeholder="7 陳大同 游">${esc(sh.text)}</textarea>
    ${sh.err ? `<div class="err">${esc(sh.err)}</div>` : ''}
    <div class="row end"><button class="btn pri big grow" data-a="saveBulk">加入名單</button></div>`;
  }
  A.saveBulk = () => {
    const sh = S.sheet;
    let added = 0, skipped = 0;
    for (const line of String(sh.text || '').split(/\r?\n/)) {
      const m = line.trim().match(/^#?(\d{1,3})[\s,，、]+([^\s,，、]+)(?:[\s,，、]+(\S+))?/);
      if (!m) { if (line.trim()) skipped++; continue; }
      const [, no, name, posRaw] = m;
      if (roster.find(x => String(x.no) === no && x.name === name)) { skipped++; continue; }
      const t = (posRaw || '').toUpperCase();
      const pos = POS_ALIAS[t] || POS_ALIAS[t.slice(0, 2)] || POS_ALIAS[t.slice(0, 1)] || '';
      roster.push({ id: E.uid('pl'), no, name, pos, isP: pos === 'P', active: true });
      added++;
    }
    if (!added) { sh.err = '沒有讀到任何一行，格式是「背號 姓名 守位」'; return render(); }
    saveRoster(); S.sheet = null; toast(`加入 ${added} 位${skipped ? `，略過 ${skipped} 行` : ''}`); render();
  };

  // ---------- 紙本紀錄表 ----------
  A.paper = d => { S.paperGame = d.id ? getGame(d.id) : null; go('paper'); };
  function paperHTML(g) {
    const T = settings.teamName;
    const innN = 8;
    const lu = g ? (g.lineup || []) : [];
    const rows = Math.max(11, lu.length + 2);
    const inn = Array.from({ length: innN }, (_, i) => `<th class="cell">${i + 1}${i === innN - 1 ? '+' : ''}</th>`).join('');
    const blankCells = Array.from({ length: innN }, () => '<td></td>').join('');
    let h = `<div class="paper"><h1>${esc(T)}系棒 比賽紀錄表</h1>
    <table class="meta"><tr><td>對手：${g ? esc(g.opp) : ''}</td><td>日期：${g ? esc(g.date) : ''}</td><td>場地：${g ? esc(g.field || '') : ''}</td><td>我方：${g ? (g.weBatFirst ? '■先攻 □後攻' : '□先攻 ■後攻') : '□先攻 □後攻'}</td></tr>
    <tr><td>開始時間：</td><td>限時：${g ? g.timeLimit + ' 分' : '□120 □150 分'}</td><td>最後一局：第＿局</td><td>記錄員：</td></tr></table>
    <h2>我方進攻（格內寫結果代號；跑到幾壘就在格角畫到幾壘，回本壘打●；打點寫右上角）</h2>
    <table class="g"><tr><th style="width:7mm">棒</th><th style="width:9mm">背號</th><th>姓名</th><th style="width:9mm">守位</th>${inn}<th style="width:8mm">打數</th><th style="width:8mm">安打</th><th style="width:8mm">打點</th><th style="width:8mm">得分</th></tr>`;
    for (let i = 0; i < rows; i++) {
      const l = lu[i], p = l && l.pid ? P(l.pid) : null;
      h += `<tr><td>${i < (lu.length || 9) ? i + 1 : ''}</td><td>${p ? esc(p.no) : ''}</td><td class="nm">${p ? esc(p.name) : ''}</td><td>${l && l.pos ? E.POS_SHORT[l.pos] : ''}</td>${blankCells}<td></td><td></td><td></td><td></td></tr>`;
    }
    h += `</table><h2>我方防守（對手打者，用棒次記）</h2><table class="o"><tr><th style="width:12mm">對手棒次</th>${inn}</tr>`;
    for (let i = 0; i < (g ? g.oppSlots || 9 : 9); i++) h += `<tr><td>${i + 1}</td>${blankCells}</tr>`;
    h += `</table><h2>投手（用球數用「正」字記，每 5 球一個正）</h2><table class="pt"><tr><th style="width:34mm">投手（背號 姓名）</th><th style="width:12mm">第幾局上場</th><th>用球數</th><th style="width:10mm">出局數</th><th style="width:10mm">被安打</th><th style="width:10mm">四壞</th><th style="width:10mm">三振</th><th style="width:10mm">失分</th></tr>`;
    const sp = g && g.startPitcher ? P(g.startPitcher) : null;
    for (let i = 0; i < 4; i++) h += `<tr><td class="nm">${i === 0 && sp ? `#${esc(sp.no)} ${esc(sp.name)}` : ''}</td><td>${i === 0 ? '1' : ''}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
    h += `</table><div class="two"><div><h2>比分</h2><table class="pt"><tr><th style="width:18mm">隊</th>${Array.from({ length: innN }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr>
      <tr><td>${g ? esc(g.weBatFirst ? T : g.opp) : '先攻'}</td>${blankCells}<td></td><td></td><td></td></tr><tr><td>${g ? esc(g.weBatFirst ? g.opp : T) : '後攻'}</td>${blankCells}<td></td><td></td><td></td></tr></table></div>
      <div><h2>換人・跑壘・失誤（局數＋內容）</h2><table class="pt"><tr><td style="height:7mm"></td></tr><tr><td style="height:7mm"></td></tr><tr><td style="height:7mm"></td></tr></table></div></div>
    <div class="legend"><b>結果代號</b>　1B 一安・2B 二安・3B 三安・HR 全壘打・BB 四壞・HBP 觸身・K 三振・GO 滾地出局・FO 飛球出局（含平飛）・DP 雙殺・E 失誤上壘（寫守位如 E6）・FC 野選・SH 犧觸・SF 犧飛・? 沒看到<br>
    <b>跑壘</b>　SB 盜壘・CS 盜壘失敗・WP 暴投・PB 捕逸・PO 牽制出局　<b>守位號碼</b>　1投 2捕 3一 4二 5三 6游 7左 8中 9右　<b>暫停</b>　每局超過兩次要換投（場內半次、場外一次）<br>
    <b>棒聯規則</b>　7 局制；4 局 10 分、5 局 7 分提前結束；3 局成立；時間到前 20 分鐘宣布該局為最後一局</div></div>`;
    return h;
  }
  VIEWS.paper = () => `${topbar('紀錄表（A4）', S.paperGame ? 'box' : 'home', '<button class="btn sm pri" data-a="doPrint">列印</button>')}
    <div class="mut pad" style="padding-bottom:0">手機沒電或忘記帶時用紙本記，賽後照著同樣的代號補登進系統。${S.paperGame ? '已帶入這場的打序。' : ''}</div>
    <div class="pwrap print-area">${paperHTML(S.paperGame)}</div>`;
  A.doPrint = () => { if (FRAMED) return toast('claude.ai 預覽裡不能列印。請用自己網址開的版本，或用電腦瀏覽器開再列印。', [], 6000); try { window.print(); } catch (e) { toast('這個環境不能直接列印，請用瀏覽器選單的「列印」或「分享→列印」'); } };

  // ---------- 面板外框 ----------
  function renderSheet() {
    const el = $('#sheet');
    const sh = S.sheet;
    if (!sh) { el.innerHTML = ''; return; }
    let inner = '';
    if (sh.k === 'pa') inner = sheetPA(sh);
    else if (sh.k === 'run') inner = sheetRun(sh);
    else if (sh.k === 'sub') inner = sheetSub(sh);
    else if (sh.k === 'batter') inner = sheetBatter();
    else if (sh.k === 'to') inner = sheetTO();
    else if (sh.k === 'menu') inner = sheetMenu();
    else if (sh.k === 'evmenu') inner = sheetEvMenu(sh);
    else if (sh.k === 'player') inner = sheetPlayer(sh);
    else if (sh.k === 'bulk') inner = sheetBulk(sh);
    else if (sh.k === 'text') inner = sheetText(sh);
    else if (sh.k === 'confirm') inner = `<div style="font-size:18px;font-weight:700;margin:8px 0 16px">${esc(sh.msg)}</div><div class="row"><button class="btn grow" data-a="closeSheet">取消</button><button class="btn grow ${sh.danger ? 'danger' : 'pri'}" data-a="confirmYes">${esc(sh.yes)}</button></div>`;
    const keep = el.querySelector('.sh');
    const scroll = keep && el.dataset.k === sh.k ? keep.scrollTop : 0;
    el.innerHTML = `<div class="ov" data-a="ovClose"><div class="sh" data-stop="1">${inner}</div></div>`;
    el.dataset.k = sh.k;
    if (scroll) el.querySelector('.sh').scrollTop = scroll;
  }
  A.ovClose = (d, el, ev) => { if (ev.target === el) { S.sheet = null; render(); } };

  // ---------- 提示 ----------
  let toastTimer = null;
  function toast(msg, actions, ms) {
    S.toast = { msg, actions: actions || [] };
    renderToast();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, ms || (actions && actions.length ? 5000 : 2600));
  }
  function renderToast() {
    const el = $('#toast');
    if (!el) return;
    const t = S.toast;
    el.innerHTML = t ? `<div class="t"><span>${esc(t.msg)}</span>${t.actions.map(a => `<button data-a="${a.a}" ${a.i != null ? `data-i="${a.i}"` : ''}>${a.label}</button>`).join('')}</div>` : '';
    el.style.bottom = S.view === 'live' ? '' : '12px';
  }

  // ---------- 事件 ----------
  A.nav = d => go(d.v);
  A.openGame = d => openGame(d.id);
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]');
    if (!el) return;
    const fn = A[el.dataset.a];
    if (!fn) return;
    if (el.dataset.a === 'ovClose') { fn(el.dataset, el, ev); return; }
    ev.preventDefault();
    if (el.closest('#toast')) { S.toast = null; renderToast(); }
    try { fn(el.dataset, el, ev); } catch (e) { console.error(e); toast('發生錯誤：' + (e.message || e)); }
  });
  function setPath(o, path, v) { const ks = path.split('.'); let t = o; for (let i = 0; i < ks.length - 1; i++) { t = t[ks[i]]; if (t == null) return; } t[ks[ks.length - 1]] = v; }
  function onField(ev) {
    const el = ev.target;
    if (el.dataset.file && ev.type === 'change') return handleImport(el);
    const v = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
    if (el.dataset.f && S.draft) setPath(S.draft, el.dataset.f, v);
    else if (el.dataset.sf && S.sheet) setPath(S.sheet, el.dataset.sf, el.dataset.sf === 'slot' ? +v : v);
    else if (el.dataset.set) { settings[el.dataset.set] = el.type === 'number' ? (el.value === '' || isNaN(+el.value) ? DEF[el.dataset.set] : +el.value) : el.value; save(K.settings, settings); }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);

  // 時鐘
  let lastClockState = -1;
  setInterval(() => {
    if (S.view !== 'live' || !S.g) return;
    const ck = clockInfo(S.g);
    const el = $('#clock');
    if (el) { el.textContent = ck.txt; el.className = 'clock ' + ck.cls; }
    if (ck.state !== lastClockState) { if (lastClockState !== -1 && !S.sheet) render(); lastClockState = ck.state; }
  }, 1000);

  // 螢幕不要暗
  let wl = null;
  async function wakeOn() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) { } }
  function wakeOff() { try { if (wl) wl.release(); } catch (e) { } wl = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.view === 'live') wakeOn(); });

  // 離線快取（放在自己的網址上時才會啟用）
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }

  // ---------- 啟動 ----------
  try { history.replaceState({ v: 'home' }, ''); } catch (e) { }
  const cur = load(K.cur, null);
  const curIt = cur && index.find(x => x.id === cur);
  if (curIt && curIt.status !== 'final' && Date.now() - curIt.updatedAt < 8 * 3600 * 1000) openGame(cur, 'live');
  else render();

  window.__kbb = { S, E, importData, lineSummary: () => lineSummary(S.g, S.c) };
})();

</script>
</body>
</html>
